[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kapsl-sglang-adapter"
version = "0.2.0"
description = "Out-of-tree SGLang KV participant adapter for Kapsl (opaque tier)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Kapsl contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.scripts]
kapsl-sglang-serve = "kapsl_sglang_adapter.launch:main"

# SGLang discovers general plugins through this entry-point group and calls the
# target in every SGLang process. Installing this package into an SGLang
# environment therefore opts every server launched from it into Kapsl
# governance.
[project.entry-points."sglang.srt.plugins"]
kapsl_kv = "kapsl_sglang_adapter.hooks:activate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
