[package]
name = "kapsl-backend-ort"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Out-of-tree ONNX Runtime native backend pack for Kapsl"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kapsl-backend-abi = "=0.1.0"
kapsl-core = "=0.3.0"
kapsl-engine-api = "=0.3.0"
half = "2"
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "download-binaries", "half", "ndarray", "tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
