[package]
name = "kapsl-backend-ort"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Out-of-tree ONNX Runtime native backend pack for Kapsl"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["profile-cpu"]
profile-cpu = ["dep:futures", "dep:kapsl-llm", "dep:tokio"]
profile-cuda12 = [
    "dep:futures",
    "dep:kapsl-llm",
    "dep:tokio",
    "kapsl-llm/onnx-cuda",
    "ort/cuda",
]
profile-tensorrt10 = [
    "dep:futures",
    "dep:kapsl-llm",
    "dep:tokio",
    "kapsl-llm/onnx-tensorrt",
    "ort/cuda",
    "ort/tensorrt",
]

[dependencies]
kapsl-backend-abi = "=0.2.0"
kapsl-core = "=0.3.0"
kapsl-engine-api = "=0.3.0"
futures = { version = "0.3", optional = true }
half = "2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
kapsl-llm = { version = "=0.3.4", default-features = false, features = ["onnx"], optional = true }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "download-binaries", "half", "ndarray", "tls-rustls"] }
rustfft = "=6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.32", features = ["rt-multi-thread", "sync"], optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
