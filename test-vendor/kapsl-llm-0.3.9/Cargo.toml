[package]
edition = "2021"
rust-version = "1.92"
name = "kapsl-llm"
version = "0.3.9"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Large language model inference with GGUF and ONNX backend support for Kapsl"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/kapsl-runtime/kapsl-sdk"

[features]
default = [
    "gguf",
    "onnx-default-providers",
]
gguf = [
    "dep:llama-cpp-2",
    "dep:llama-cpp-sys-2",
    "dep:kapsl-loader",
]
gguf-cuda = [
    "gguf",
    "llama-cpp-2/cuda",
]
gguf-cuda-shared-kv = [
    "gguf-cuda",
    "kapsl-hal/cuda",
    "dep:cudarc",
]
gguf-external-kv = ["gguf"]
onnx = ["dep:ort"]
onnx-coreml = [
    "onnx",
    "ort/coreml",
]
onnx-cuda = [
    "onnx",
    "ort/cuda",
]
onnx-cuda-pool = [
    "onnx-cuda",
    "kapsl-hal/cuda",
]
onnx-default-providers = [
    "onnx-cuda",
    "onnx-tensorrt",
    "onnx-coreml",
    "onnx-openvino",
]
onnx-directml = [
    "onnx",
    "ort/directml",
]
onnx-openvino = [
    "onnx",
    "ort/openvino",
]
onnx-rocm = [
    "onnx",
    "ort/rocm",
]
onnx-tensorrt = [
    "onnx-cuda",
    "ort/tensorrt",
]

[lib]
name = "kapsl_llm"
path = "src/lib.rs"

[[test]]
name = "device_kv_binding"
path = "tests/device_kv_binding.rs"

[[test]]
name = "gguf_memory_probe"
path = "tests/gguf_memory_probe.rs"

[dependencies.anyhow]
version = "1.0.103"

[dependencies.async-stream]
