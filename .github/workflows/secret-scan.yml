name: Secret scan (all branches)

# CI checks each pull request on the commits it adds and each push on that
# branch's history. This repository is public, so a secret on any pushed
# branch is already exposed, merged or not: scan every branch on a schedule.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all-branches:
    name: Scan every branch for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out every branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all fetched history
        # --verbose prints each finding's file, line, commit and fingerprint;
        # --redact keeps the matched value out of this public log.
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git \
            --no-banner --redact --verbose --log-opts="--all"
