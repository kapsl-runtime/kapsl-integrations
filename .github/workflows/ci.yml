name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ort-cpu:
    name: ORT native adapter (CPU)
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare exact official ORT CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/onnxruntime"
          mkdir -p "$runtime_dir"
          python3 integrations/ort/packaging/fetch_ort_runtime.py \
            --output "$runtime_dir/libonnxruntime.so.1"
          ln -s libonnxruntime.so.1 "$runtime_dir/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$runtime_dir"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=$runtime_dir"
          } >> "$GITHUB_ENV"

      - name: Show pinned Rust toolchain
        run: rustc --version --verbose

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Lint adapter
        run: cargo clippy -p kapsl-backend-ort --all-targets --locked -- -D warnings

      - name: Test CPU task pipelines, batching, cancellation, concurrency, and lifecycle through ABI v1
        run: cargo test -p kapsl-backend-ort --locked

      - name: Validate accelerator profile and governed-allocator contracts without a GPU
        run: |
          for profile in profile-cuda12 profile-tensorrt10; do
            cargo clippy \
              -p kapsl-backend-ort \
              --no-default-features \
              --features "$profile" \
              --all-targets \
              --locked \
              -- \
              -D warnings
            cargo test \
              -p kapsl-backend-ort \
              --no-default-features \
              --features "$profile" \
              --locked
          done

      - name: Test deterministic packaging, signing, and parity tooling
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.12.12
          ruff check integrations/ort/packaging integrations/ort/conformance
          ruff format --check integrations/ort/packaging integrations/ort/conformance
          python3 -m compileall -q integrations/ort/packaging integrations/ort/conformance
          python3 -m unittest discover -s integrations/ort/packaging/tests -v
          python3 -m unittest discover -s integrations/ort/conformance/tests -v

      - name: Build, sign, and reproduce the CPU pack with an ephemeral test key
        env:
          KAPSL_VERSION: "0.2.3"
        run: |
          test_root="$(mktemp -d)"
          trap 'rm -rf "$test_root"' EXIT INT TERM
          openssl genpkey -algorithm ED25519 -out "$test_root/key.pem"
          public_key="$(openssl pkey -in "$test_root/key.pem" -pubout -outform DER \
            | tail -c 32 | base64 | tr -d '\n')"

          for run in first second; do
            KAPSL_ORT_PACK_OUTPUT_DIR="$test_root/$run" \
            KAPSL_ORT_PACK_BUILD_DIR="$test_root/build" \
            KAPSL_BACKEND_SIGNING_KEY="$test_root/key.pem" \
            KAPSL_BACKEND_EXPECTED_PUBLIC_KEY="$public_key" \
              integrations/ort/packaging/build_cpu_pack.sh
          done

          dirty="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "Packaging modified the certified source checkout:" >&2
            printf '%s\n' "$dirty" >&2
            exit 1
          fi

          artifact="kapsl-backend-onnx-cpu-${KAPSL_VERSION}-linux-x86_64.tar.gz"
          cmp "$test_root/first/$artifact" "$test_root/second/$artifact"
          cmp "$test_root/first/$artifact.manifest.json" "$test_root/second/$artifact.manifest.json"
          cmp "$test_root/first/$artifact.sha256" "$test_root/second/$artifact.sha256"
          cmp "$test_root/first/$artifact.sig" "$test_root/second/$artifact.sig"

          mkdir "$test_root/extracted"
          tar -xzf "$test_root/first/$artifact" -C "$test_root/extracted"
          nm -D --defined-only "$test_root/extracted/libkapsl_backend_ort.so" \
            | grep -Eq '[[:space:]]kapsl_backend_v1$'
          python3 - "$test_root/extracted/libkapsl_backend_ort.so" <<'PY'
          import ctypes
          import pathlib
          import sys

          library = ctypes.CDLL(str(pathlib.Path(sys.argv[1]).resolve()), mode=ctypes.RTLD_LOCAL)
          getattr(library, "kapsl_backend_v1")
          PY

      - name: Verify exported backend-neutral entrypoint
        run: |
          test -s integrations/ort/third_party/ONNX-RUNTIME-LICENSE
          test -x integrations/ort/packaging/build_cpu_pack.sh
          test -x integrations/ort/packaging/build_accelerator_packs.sh
          test -x integrations/ort/packaging/build_release_profile.sh
          test -x integrations/ort/packaging/collect_cuda_runtime.sh
          test -x integrations/ort/packaging/fetch_tensorrt_runtime.py
          test -x integrations/ort/packaging/release.py
          test -x integrations/ort/packaging/reproduce_release_profile.sh
          grep -Fq '"runtime_version": "1.23.2"' integrations/ort/src/lib.rs
          grep -Fq '"binding_version": "2.0.0-rc.11"' integrations/ort/src/lib.rs
          grep -Fq 'KAPSL_ORT_PACK_PROFILES:-cuda12 tensorrt10' \
            integrations/ort/packaging/build_accelerator_packs.sh
          grep -Fq 'feature="profile-' \
            integrations/ort/packaging/build_accelerator_packs.sh
          grep -Fq '2083e361072a79ce16a90dcd5f5cb3ab92574a82a3ce0ac01e5cfa3158176f53' \
            integrations/ort/packaging/fetch_ort_gpu_runtime.py
          grep -Fq '4a82f0bda2874596f202f6edc8dae99b86a3c4ec2fa142a9c847c4d3a57864a0' \
            integrations/ort/packaging/fetch_tensorrt_runtime.py
          grep -Fq 'sha256:59e0e4376a0f16d10b03d3a14344b80a866a1674cb4948cb318291387ac05010' \
            integrations/ort/packaging/collect_cuda_runtime.sh

      - name: Enforce published Kapsl dependencies
        run: |
          cargo metadata --locked --no-deps --format-version 1 | jq -e '
            [.packages[]
              | select(.name == "kapsl-backend-ort")
              | .dependencies[]
              | select(.name | startswith("kapsl"))
              | select(.source == null or (.req | startswith("=") | not))]
            | length == 0
          '

  vllm-tests:
    name: vLLM host tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e 'integrations/vllm[test]'

      - name: Run connector host tests
        env:
          PYTHONPATH: integrations/vllm/src
        run: python -m unittest discover -s integrations/vllm/tests -v

  vllm-package:
    name: Build and inspect vLLM distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check "build==1.5.0" "twine==6.2.0"

      - name: Build wheel and source distribution
        run: python -m build --outdir dist integrations/vllm

      - name: Validate metadata and archive contents
        run: |
          python -m twine check --strict dist/*
          python integrations/vllm/scripts/check_dist_artifacts.py dist

      - name: Smoke-test the built wheel
        run: |
          python -m pip install --disable-pip-version-check --no-deps --force-reinstall dist/*.whl
          schema_file="$(mktemp)"
          kapsl-vllm-plan --print-schema > "$schema_file"
          python -m json.tool "$schema_file" >/dev/null

  workflow-security:
    name: Workflow and secret checks
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required by zizmor to inspect referenced workflow actions.
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.10

      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          inputs: .github

      - name: Scan repository history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --no-banner --redact
