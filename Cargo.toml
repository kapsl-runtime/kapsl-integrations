[workspace.package]
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
repository = "https://github.com/kapsl-runtime/kapsl-integrations"

# TEST ONLY - never merge. Packaged kapsl-llm 0.3.8 plus kapsl-runtime/kapsl-sdk#235
